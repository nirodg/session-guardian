<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
<title id="title">SessionGuardian — Never lose context. Never lose direction.</title>
<desc id="desc">A luminous shield surrounding a terminal prompt, connected to project memory, session recovery and scope protection.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050b1b"/><stop offset=".55" stop-color="#071b3b"/><stop offset="1" stop-color="#100a2c"/></linearGradient>
 <linearGradient id="edge" x2="1" y2="1"><stop stop-color="#20e6ff"/><stop offset=".55" stop-color="#4388ff"/><stop offset="1" stop-color="#bd63ff"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#087dff" stop-opacity=".42"/><stop offset="1" stop-color="#07152d" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
 <filter id="shine"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="560" fill="url(#bg)"/>
<ellipse cx="800" cy="245" rx="500" ry="270" fill="url(#glow)"/>
<g opacity=".18" stroke="#1b79dd" fill="none">
 <path d="M0 80H1600M0 160H1600M0 240H1600M0 320H1600M0 400H1600M0 480H1600"/>
 <path d="M100 0V560M300 0V560M500 0V560M700 0V560M900 0V560M1100 0V560M1300 0V560M1500 0V560"/>
</g>
<g fill="none" stroke="url(#edge)" stroke-width="2" opacity=".7">
 <path d="M370 160H560L640 220M1230 160H1040L960 220M370 335H560L650 300M1230 335H1040L950 300"/>
</g>
<g filter="url(#shine)">
 <path d="M800 48 1000 122V250Q1000 390 800 462Q600 390 600 250V122Z" fill="#071a39" stroke="url(#edge)" stroke-width="7"/>
 <path d="M800 77 972 139V249Q972 367 800 430Q628 367 628 249V139Z" fill="none" stroke="#16cfff" stroke-opacity=".45" stroke-width="2"/>
 <rect x="690" y="205" width="220" height="112" rx="18" fill="#061126" stroke="#27dfff" stroke-width="3"/>
 <path d="m746 240 38 22-38 22M806 286h52" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g font-family="Inter,Arial,sans-serif" fill="#eaf5ff">
 <g transform="translate(95 120)">
  <rect width="300" height="125" rx="14" fill="#07152c" stroke="#2388df" stroke-width="2"/>
  <circle cx="24" cy="22" r="6" fill="#ff657a"/><circle cx="46" cy="22" r="6" fill="#ffd05c"/><circle cx="68" cy="22" r="6" fill="#39d98a"/>
  <text x="24" y="65" font-size="22" font-weight="700">PROJECT MEMORY</text><text x="24" y="96" font-size="17" fill="#9eb8d8">Goals · Decisions · State</text>
 </g>
 <g transform="translate(1205 120)">
  <rect width="300" height="125" rx="14" fill="#07152c" stroke="#8c65ff" stroke-width="2"/>
  <circle cx="24" cy="22" r="6" fill="#ff657a"/><circle cx="46" cy="22" r="6" fill="#ffd05c"/><circle cx="68" cy="22" r="6" fill="#39d98a"/>
  <text x="24" y="65" font-size="22" font-weight="700">SESSION RECOVERY</text><text x="24" y="96" font-size="17" fill="#9eb8d8">Checkpoint · Resume · Handoff</text>
 </g>
 <g transform="translate(95 300)">
  <rect width="300" height="100" rx="14" fill="#07152c" stroke="#2388df" stroke-width="2"/>
  <text x="24" y="42" font-size="22" font-weight="700">SCOPE PROTECTION</text><text x="24" y="72" font-size="17" fill="#9eb8d8">Stay focused. Avoid drift.</text>
 </g>
 <g transform="translate(1205 300)">
  <rect width="300" height="100" rx="14" fill="#07152c" stroke="#8c65ff" stroke-width="2"/>
  <text x="24" y="42" font-size="22" font-weight="700">MULTI-AGENT READY</text><text x="24" y="72" font-size="17" fill="#9eb8d8">One memory. Any agent.</text>
 </g>
 <text x="800" y="510" text-anchor="middle" font-size="48" font-weight="800" letter-spacing="3">SESSION <tspan fill="#30dfff">GUARDIAN</tspan></text>
 <text x="800" y="543" text-anchor="middle" font-size="18" letter-spacing="5" fill="#b6c9e7">NEVER LOSE CONTEXT. NEVER LOSE DIRECTION.</text>
</g>
</svg>