name: Core tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure Git identity for tests
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
      - name: Run test suite
        run: python -m unittest discover -s tests -v

  install-posix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install from checkout
        run: bash install.sh --source . --yes --agent generic
      - name: Smoke test installed CLI
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          session-guardian doctor
          mkdir -p "$RUNNER_TEMP/proj" && cd "$RUNNER_TEMP/proj"
          session-guardian init
          session-guardian checkpoint
          session-guardian audit
          session-guardian recover --format markdown
      - name: Uninstall
        run: bash install.sh --uninstall

  install-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from checkout (Windows PowerShell 5.1)
        shell: powershell
        run: .\install.ps1 -Source . -Yes -Agent generic
      - name: Smoke test installed CLI
        shell: pwsh
        run: |
          $sg = Join-Path $env:LOCALAPPDATA "Programs\session-guardian\bin\session-guardian.cmd"
          & $sg doctor; if ($LASTEXITCODE) { exit 1 }
          $proj = Join-Path $env:RUNNER_TEMP "proj"; New-Item -ItemType Directory -Force $proj | Out-Null; Set-Location $proj
          & $sg init; if ($LASTEXITCODE) { exit 1 }
          & $sg checkpoint; if ($LASTEXITCODE) { exit 1 }
          & $sg audit; if ($LASTEXITCODE) { exit 1 }
          & $sg watch start --interval 1; if ($LASTEXITCODE) { exit 1 }
          & $sg watch stop; if ($LASTEXITCODE) { exit 1 }
      - name: Uninstall
        shell: pwsh
        run: .\install.ps1 -Uninstall
