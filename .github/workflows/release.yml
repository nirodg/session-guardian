name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches core version
        run: |
          core="$(python core/session_guardian.py --version | awk '{print $2}')"
          [ "v$core" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match core version $core"; exit 1; }
      - name: Run tests
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
          python -m unittest discover -s tests
      - name: Extract release notes from CHANGELOG.md
        run: |
          python - <<'PY'
          import os, re
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[?" + re.escape(version) + r"\]?.*?$(.*?)(?=^## |\Z)", text, re.M | re.S)
          open("notes.md", "w", encoding="utf-8").write((m.group(1).strip() if m else "See CHANGELOG.md") + "\n")
          PY
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md install.sh install.ps1 core/session_guardian.py
